name: SocketFi
packages:
  reown:
    url: https://github.com/reown-com/reown-swift.git
    branch: main
  web3:
    url: https://github.com/Boilertalk/Web3.swift.git
    version: 0.8.0
  hdwallet:
    url: https://github.com/kailuo/HDWallet.git
    branch: xcode26
  cryptoswift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    version: 1.8.4
  starscream:
    url: https://github.com/daltoniam/Starscream.git
    version: 4.0.8
options:
  bundleIdPrefix: fi.socket
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
configs:
  Testnet: debug
  Production: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: GC29BX444D
targets:
  SocketFiNativeKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SocketFiNativeKit
    info:
      path: Sources/SocketFiNativeKit/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.socket.socketfi.nativekit
  SocketFi:
    type: application
    platform: iOS
    sources:
      - path: Sources/SocketFiApp
    info:
      path: Sources/SocketFiApp/Info.plist
      properties:
        CFBundleDisplayName: SocketFi
        SocketFiAPIBaseURL: $(SOCKETFI_API_BASE_URL)
        SocketFiClientID: $(SOCKETFI_CLIENT_ID)
        SocketFiApplicationID: $(PRODUCT_BUNDLE_IDENTIFIER)
        SocketFiNetwork: $(SOCKETFI_NETWORK)
        SocketFiRPID: socket.fi
        SocketFiWalletConnectProjectID: $(SOCKETFI_WALLETCONNECT_PROJECT_ID)
        LSApplicationQueriesSchemes:
          - metamask
          - trust
          - cbwallet
          - rainbow
          - uniswap
          - safe
          - zerion
          - rabby
        CFBundleURLTypes:
          - CFBundleURLName: fi.socket.socketfi.walletconnect
            CFBundleURLSchemes:
              - socketfi
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/SocketFiApp/SocketFi.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: fi.socket.socketfi
      configs:
        Testnet:
          PRODUCT_BUNDLE_IDENTIFIER: fi.socket.socketfi.testnet
          SOCKETFI_API_BASE_URL: https://api.socket.fi
          SOCKETFI_CLIENT_ID: sf_client_live_e5fr319q79wpcojnx7s7zlhwu41w
          SOCKETFI_NETWORK: TESTNET
          SOCKETFI_WALLETCONNECT_PROJECT_ID: b3caac6f2b5c23a9134c1a14d58509d9
        Production:
          PRODUCT_BUNDLE_IDENTIFIER: fi.socket.socketfi
          SOCKETFI_API_BASE_URL: https://api.socket.fi
          SOCKETFI_CLIENT_ID: REPLACE_WITH_PRODUCTION_IOS_CLIENT_ID
          SOCKETFI_NETWORK: PUBLIC
          SOCKETFI_WALLETCONNECT_PROJECT_ID: b3caac6f2b5c23a9134c1a14d58509d9
    dependencies:
      - target: SocketFiNativeKit
      - package: reown
        product: ReownAppKit
      - package: reown
        product: WalletConnectNetworking
      - package: reown
        product: WalletConnect
      - package: web3
        product: Web3
      - package: hdwallet
        product: HDWalletKit
      - package: cryptoswift
        product: CryptoSwift
      - package: starscream
        product: Starscream
    scheme:
      environmentVariables:
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: false
      testTargets:
        - SocketFiTests
  SocketFiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SocketFiNativeKitTests
    dependencies:
      - target: SocketFiNativeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.socket.socketfi.tests
        GENERATE_INFOPLIST_FILE: YES
  SocketFiDeviceFlowTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SocketFiDeviceFlowTests
    dependencies:
      - target: SocketFi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.socket.socketfi.deviceflowtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SocketFi
        CODE_SIGN_STYLE: Automatic
  SocketFiAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SocketFiAppTests
    dependencies:
      - target: SocketFi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.socket.socketfi.apptests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SocketFi.app/SocketFi
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  SocketFiDeviceFlow:
    build:
      targets:
        SocketFi: all
        SocketFiDeviceFlowTests: [test]
        SocketFiAppTests: [test]
    test:
      config: Testnet
      targets:
        - SocketFiDeviceFlowTests
        - SocketFiAppTests
