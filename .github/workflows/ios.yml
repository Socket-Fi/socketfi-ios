name: iOS build and tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test on an available iPhone simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'j=JSON.parse(STDIN.read); d=j.fetch("devices").values.flatten.find { |v| v.fetch("name").start_with?("iPhone") }; abort "No iPhone simulator available" unless d; puts d.fetch("udid")')
          xcodebuild -project SocketFi.xcodeproj -scheme SocketFi -configuration Testnet -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
